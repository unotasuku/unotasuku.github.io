<header class="quarto-title-block default"><div class="quarto-title"><h1 class="title">研究業績</h1></div></header>
<p>researchmap に公開している MISC と講演・口頭発表等を一覧表示します。</p>
<blockquote class="blockquote"><p>注：researchmap の公開 API から全件を取得しています。researchmap 側で追加・更新した公開業績は、このページにも自動で反映されます。</p></blockquote>
<p><a href="https://researchmap.jp/uno.tasuku">researchmap のプロフィール</a></p>
<h2 class="anchored">MISC</h2>
<div id="misc-list">researchmap から読み込み中...</div>
<h2 class="anchored">講演・口頭発表等</h2>
<div id="presentations-list">researchmap から読み込み中...</div>
</main>
</div>
<script>
const RM_PERMALINK = "uno.tasuku";
const RM_API = "https://api.researchmap.jp";
const RM_WEB = "https://researchmap.jp";
function langText(value){if(!value)return "";if(typeof value === "string")return value;return value.ja || value.en || "";}
function personNames(value){if(!value)return "";const people=value.ja || value.en || [];return people.map(x=>x.name).filter(Boolean).join("、");}
function escapeHtml(value){return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function recordId(item){if(item["rm:id"])return item["rm:id"];if(item["@id"])return item["@id"].split("/").filter(Boolean).pop();return "";}
function recordUrl(item,type){const id=recordId(item);return id ? `${RM_WEB}/${RM_PERMALINK}/${type}/${id}` : `${RM_WEB}/${RM_PERMALINK}`;}
function uniqueLinks(item,type){const links=[{label:"researchmap",url:recordUrl(item,type)}];const doiList=item?.identifiers?.doi || [];doiList.forEach(doi=>{if(doi)links.push({label:"DOI",url:`https://doi.org/${doi}`});});(item.see_also || []).forEach(link=>{if(!link?.["@id"])return;links.push({label:link.label || "関連リンク",url:link["@id"]});});const seen=new Set();return links.filter(link=>{if(!link.url || seen.has(link.url))return false;seen.add(link.url);return true;});}
function linkHtml(item,type){return uniqueLinks(item,type).map(link=>`<a href="${escapeHtml(link.url)}">${escapeHtml(link.label)}</a>`).join(" ／ ");}
function bibliographicInfo(item){const parts=[];if(item.volume)parts.push(`${item.volume}巻`);if(item.number)parts.push(`${item.number}号`);if(item.starting_page || item.ending_page){const start=item.starting_page || "";const end=item.ending_page || "";parts.push(start && end ? `${start}–${end}頁` : `${start || end}頁`);}const publisher=langText(item.publisher);if(publisher)parts.push(publisher);return parts.join("、");}
function renderMisc(items){const root=document.getElementById("misc-list");if(!items.length){root.textContent="公開されている MISC はありません。";return;}root.innerHTML=items.map(item=>{const title=langText(item.paper_title)||"無題";const authors=personNames(item.authors);const journal=langText(item.publication_name);const date=item.publication_date||"";const info=bibliographicInfo(item);const description=langText(item.description);return `<section class="research-entry"><h3>${escapeHtml(title)}</h3><ul>${authors?`<li><strong>著者</strong>：${escapeHtml(authors)}</li>`:""}<li><strong>タイトル</strong>：${escapeHtml(title)}</li>${date?`<li><strong>出版年</strong>：${escapeHtml(date)}</li>`:""}${journal?`<li><strong>雑誌・出版物</strong>：${escapeHtml(journal)}</li>`:""}${info?`<li><strong>書誌情報</strong>：${escapeHtml(info)}</li>`:""}<li><strong>リンク</strong>：${linkHtml(item,"misc")}</li></ul>${description?`<h4>概要</h4><p>${escapeHtml(description)}</p>`:""}<hr></section>`;}).join("");}
function renderPresentations(items){const root=document.getElementById("presentations-list");if(!items.length){root.textContent="公開されている講演・口頭発表等はありません。";return;}root.innerHTML=items.map(item=>{const title=langText(item.presentation_title)||"無題";const presenters=personNames(item.presenters);const event=langText(item.event);const date=item.publication_date||item.from_event_date||"";const description=langText(item.description);const invited=item.invited===true?"招待講演":"";return `<section class="research-entry"><h3>${escapeHtml(title)}</h3><ul>${presenters?`<li><strong>発表者</strong>：${escapeHtml(presenters)}</li>`:""}<li><strong>タイトル</strong>：${escapeHtml(title)}</li>${date?`<li><strong>発表日</strong>：${escapeHtml(date)}</li>`:""}${event?`<li><strong>学会・研究会</strong>：${escapeHtml(event)}</li>`:""}${invited?`<li><strong>区分</strong>：${invited}</li>`:""}<li><strong>リンク</strong>：${linkHtml(item,"presentations")}</li></ul>${description?`<h4>概要</h4><p>${escapeHtml(description)}</p>`:""}<hr></section>`;}).join("");}
async function loadResearchmap(type,renderer){const url=`${RM_API}/${RM_PERMALINK}/${type}?limit=1000&format=json`;try{const response=await fetch(url,{headers:{"Accept":"application/json"}});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();const items=Array.isArray(data.items)?data.items:[];renderer(items);}catch(error){const rootId=type==="misc"?"misc-list":"presentations-list";document.getElementById(rootId).innerHTML=`researchmap からの取得に失敗しました。<a href="${RM_WEB}/${RM_PERMALINK}">researchmap で確認</a>`;console.error(error);}}
loadResearchmap("misc",renderMisc);
loadResearchmap("presentations",renderPresentations);
</script>
